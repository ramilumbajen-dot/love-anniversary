<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Happy Anniversary 💜</title>
    <meta
      name="description"
      content="A romantic anniversary letter website filled with love, music, and memories."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora aurora-one"></div>
    <div class="aurora aurora-two"></div>

    <header class="topbar">
      <div class="brand">OUR LOVE</div>
      <button id="loveButton" class="love-button" type="button">💜 LOVE</button>
    </header>

    <main>
      <section class="hero">
        <p class="eyebrow">for us</p>
        <h1>Happy Anniversary</h1>
        <p class="hero-copy">Another year, another chapter, and still the best part of my story is you.</p>

        <div class="countdown" aria-live="polite">
          <strong>FOREVER STARTED HERE</strong>
          <span>With love, patience, and us.</span>
        </div>
      </section>

      <div class="letter-area">
        <div class="halo"></div>
        <div id="envelope" class="envelope" tabindex="0" aria-label="Open love letter">
          <div class="envelope-inner">
            <div class="heart">♥</div>
            <div class="label">Open Letter</div>
          </div>
        </div>
      </div>

      <section class="features">
        <article class="memory-card tall">
          <img src="https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=900&q=80" alt="Couple together" />
        </article>

        <article class="memory-card">
          <img src="https://images.unsplash.com/photo-1517841905240-472988babdf9?auto=format&fit=crop&w=900&q=80" alt="Happy memory" />
        </article>

        <article class="memory-card">
          <img src="https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&fit=crop&w=900&q=80" alt="Travel memory" />
        </article>
      </section>

      <section class="qr-card">
        <div class="qr-copy">
          <p class="eyebrow">Scan this</p>
          <h2>Keep this memory with you.</h2>
        </div>
        <div id="qrcode" aria-label="QR code to the anniversary website"></div>
        <button id="downloadQr" type="button">Download QR</button>
      </section>

      <section class="music-card">
        <div class="voice-icon">♫</div>
        <div class="voice-copy">
          <h3>Love soundtrack</h3>
          <p>Play a soft song for the mood.</p>
        </div>
        <button id="musicToggle" class="voice-button" type="button">Play</button>
      </section>
    </main>

    <div id="letterModal" class="modal" aria-hidden="true">
      <div class="modal-backdrop"></div>
      <div class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="letterTitle">
        <button id="closeLetter" class="close-letter" type="button" aria-label="Close letter">×</button>
        <div id="letterContent"></div>
      </div>
    </div>

    <div id="toast" class="toast" aria-live="polite">I love you so much 💜</div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="script.js"></script>
  </body>
</html>
